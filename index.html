<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rabbit Development</title>
<style>
  :root { --bg: #f7f4ee; --fg: #2b2a27; --muted: #7a756c; --line: #e2dcd0; --accent: #b08d57; --accent-ink: #7f6435; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1d1b18; --fg: #ece7dd; --muted: #a39c8f; --line: #3a362f; --accent: #c9a56b; --accent-ink: #e2c48f; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; line-height: 1.6; }
  main { max-width: 760px; margin: 0 auto; padding: 56px 20px 80px; }
  .eyebrow { font-size: .74rem; letter-spacing: .14em; text-transform: uppercase; color: var(--accent-ink); font-weight: 700; }
  h1 { font-size: 2rem; margin: 6px 0 8px; }
  p { margin: 0 0 24px; color: var(--muted); max-width: 60ch; }
  ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
  li a { display: block; padding: 16px 18px; border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 6px; color: inherit; text-decoration: none; }
  li a:hover { border-color: var(--accent); }
  li b { display: block; font-size: 1.05rem; }
  li span { color: var(--muted); font-size: .9rem; }
  footer { margin-top: 48px; color: var(--muted); font-size: .8rem; }
</style>
</head>
<body>
<main>
  <div class="eyebrow">Rabbit Development</div>
  <h1>작은 사업을 위한 도구</h1>
  <p>현장에서 바로 쓰는 계산기와 유틸리티를 모아 둡니다. 설치 없이 브라우저에서 열리고, 입력값은 사용하는 기기에만 저장됩니다.</p>
  <ul>
    <li><a href="/costcalculator/"><b>본식스냅업체 원가 산정 프로그램</b><span>작가 촬영비·후반 인력·플래닝업체 수수료를 넣고 상품별 잔액과 월 손익을 계산</span></a></li>
  </ul>
  <footer>© Rabbit Development</footer>
</main>
</body>
</html>
